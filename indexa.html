<!DOCTYPE html>
<!-- Comment -->
<html lang="en">
  
<!-- Head Stuff -->
  <head>
    <!--Website Tab Title-->
    <title>AP Countdowns</title>
    <!--Linking CSS Sheet that has all other CSS's attached-->
    <link rel="stylesheet" href="../aaaMAIN.css">

    <!-- Load an icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/0ecee0f13d.js" crossorigin="anonymous"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Header Stuff -->
  <header>
    
    
    
  </header>

<!-- Body Stuff -->
  
  <body>
    <table style="width:100%">
      <tr>
        <th>Exam Name</th>
        <th>Specific Date</th>
        <th>Countdown</th>
      </tr>
      <tr>
        <td>AP United States</td>
        <td>Monday, May 6 - 8am</td>
        <script>
          // Set the date we're counting down to
          var countDownDate = new Date("May 6, 2024 08:00:00").getTime();
          
          // Update the count down every 1 second
          var x = setInterval(function() {
          
            // Get today's date and time
            var now = new Date().getTime();
          
            // Find the distance between now and the count down date
            var distance = countDownDate - now;
          
            // Time calculations for days, hours, minutes and seconds
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
          
            // Display the result in the element with id="apus"
            document.getElementById("apus").innerHTML = days + " days " + hours + " hours "
            + minutes + " minutes " + seconds + " seconds ";
          
            // If the count down is finished, write some text
            if (distance < 0) {
              clearInterval(x);
              document.getElementById("apus").innerHTML = "Exam Passed, Hopefully";
            }
          }, 1000);
          </script>
        <td><p id="apus"></p></td>
      </tr>
