<!DOCTYPE html>
<html lang="en">
  
<!-- Head Stuff -->
  <head>

    <!--Linking CSS Sheet that has all other CSS's attached-->
    <link rel="stylesheet" href="../aaaMAIN.css">

    <!-- Load an icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/0ecee0f13d.js" crossorigin="anonymous"></script>
    
    <!-- Font -->
    <link href='https://fonts.googleapis.com/css?family=Albert Sans' rel='stylesheet'>

    <!--Responsive Web Tag-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>

<!-- Header Stuff -->
  <header>
    <div class="navbar" id="Navbar">
      <a class="active" href="https://danielnik.com"><i class="fa fa-fw fa-home"></i> Home</a>
      <a class="nonactive" href="/resume"><i class="fa-solid fa-user"></i> Resume</a>

      <a href="javascript:void(0);" class="icon" onclick="topNav()"><i class="fa fa-bars"></i></a>
    </div>

<!-- Body Stuff -->
  <body>


    

    <script>
      function topNav() {
        var x = document.getElementById("Navbar");
        if (x.className === "navbar") {
          x.className += " responsive";
        } else {
          x.className = "navbar";
        }
      }
      </script>
  </body>
